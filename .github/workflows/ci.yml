name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://knowledge:knowledge@localhost:5432/knowledge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Validate content JSON
        run: pnpm content:verify

      - name: Validate GitHub resource cards
        run: pnpm resources:github:validate

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Build
        run: pnpm run build
